name: Release

on:
  push:
    branches: [release]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public --tag rc

      - name: Create GitHub Release
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          BODY=$(awk "/^## ${VERSION#v} /{found=1; next} /^## /{found=0} found" CHANGELOG.md)
          gh release create "$VERSION" --title "$VERSION" --notes "$BODY" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
